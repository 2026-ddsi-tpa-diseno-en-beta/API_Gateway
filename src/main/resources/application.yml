server:
  port: ${PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: framework

spring:
  application:
    name: donatrack-api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 45s
      default-filters:
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY
      routes:
        - id: donaciones
          uri: ${DONACIONES_URL:https://donaciones-xouj.onrender.com}
          predicates:
            - Path=/api/donaciones/**
          filters:
            - StripPrefix=2
        - id: donadores-entidades
          uri: ${DONADORES_ENTIDADES_URL:https://entrega-2-lolasimone.onrender.com}
          predicates:
            - Path=/api/donadores-entidades/**
          filters:
            - StripPrefix=2
        - id: logistica
          uri: ${LOGISTICA_URL:https://donatrack-api-logistica-diseno-en-beta.onrender.com}
          predicates:
            - Path=/api/logistica/**
          filters:
            - StripPrefix=2
        - id: incentivos
          uri: ${INCENTIVOS_URL:https://entrega-2-melinazingales.onrender.com}
          predicates:
            - Path=/api/incentivos/**
          filters:
            - StripPrefix=2
        - id: consultas
          uri: ${CONSULTAS_URL:http://localhost:8085}
          predicates:
            - Path=/api/consultas/**
          filters:
            - StripPrefix=2
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:*}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: ["*"]
            exposedHeaders: [X-Trace-Id]
            allowCredentials: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${DD_SERVICE:donatrack-api-gateway}
      env: ${DD_ENV:prod}
  datadog:
    metrics:
      export:
        enabled: ${DATADOG_ENABLED:false}
        api-key: ${DATADOG_API_KEY:}
        uri: ${DATADOG_URI:https://api.datadoghq.com}
        step: ${DATADOG_STEP:30s}

logging:
  level:
    org.springframework.cloud.gateway: INFO
